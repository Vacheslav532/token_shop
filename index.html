<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Магазин токенов</title>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  * { box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, sans-serif;
    background: var(--tg-theme-bg-color, #fff);
    color: var(--tg-theme-text-color, #000);
    padding: 16px;
    margin: 0;
  }
  h2 { text-align: center; margin: 10px 0 20px; }
  .card {
    background: var(--tg-theme-secondary-bg-color, #f1f1f1);
    border-radius: 14px;
    padding: 16px;
    margin-bottom: 12px;
  }
  .price {
    font-size: 22px;
    font-weight: bold;
    color: var(--tg-theme-button-color, #2AABEE);
  }
  .btn {
    display: block;
    width: 100%;
    padding: 12px;
    font-size: 16px;
    border: none;
    border-radius: 10px;
    background: var(--tg-theme-button-color, #2AABEE);
    color: var(--tg-theme-button-text-color, #fff);
    cursor: pointer;
    margin-top: 10px;
  }
  .btn:active { opacity: 0.8; }
</style>
</head>
<body>
  <h2>🛍 Купить токены</h2>
  <div class="card">
    <div>1 токен</div>
    <div class="price">15 ₽</div>
    <button class="btn" onclick="buy(1)">Купить</button>
  </div>
  <div class="card">
    <div>5 токенов</div>
    <div class="price">75 ₽</div>
    <button class="btn" onclick="buy(5)">Купить</button>
  </div>
  <div class="card">
    <div>10 токенов</div>
    <div class="price">150 ₽</div>
    <button class="btn" onclick="buy(10)">Купить</button>
  </div>

  <script>
    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    function buy(tokens) {
      tg.sendData(JSON.stringify({
        action: "buy_tokens",
        tokens: tokens
      }));
      tg.close();
    }
  </script>
</body>
</html>
